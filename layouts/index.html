{{ define "main" }}
{{ $css := "css/welcome-form.css" }}
<div class="welcome-container">
  <div class="welcome-message">
    <h1>Welcome to Our Website</h1>
    <p>Please fill out the form below to get started.</p>
  </div>
  
  <div class="form-container">
    <form id="user-form" class="user-form">
      <div class="form-group">
        <label for="firstName">First Name</label>
        <input type="text" id="firstName" name="firstName" class="form-control" required>
      </div>
      
      <div class="form-group">
        <label for="lastName">Last Name</label>
        <input type="text" id="lastName" name="lastName" class="form-control" required>
      </div>
      
      <div class="form-group">
        <button type="submit" class="submit-button">Submit</button>
      </div>
    </form>
  </div>
</div>

<section id="cncf">
    {{ partial "cncf.html" . }}
</section>
{{- end -}}

{{ define "hero-more" }}
{{ with site.GetPage "section" "docs/tutorials/kubernetes-basics" }}
<a href="{{ .RelPermalink }}"><button id="quickstartButton" class="button">{{ .LinkTitle }}</button></a>
{{ end }}
{{ end }}
